[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kagent"
version = "0.2.0"
description = "AI-powered penetration testing agent"
readme = "readme.md"
requires-python = ">=3.11"

dependencies = [
    "httpx==0.28.1",
    "mcp==1.28.1",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "rich==15.0.0",
    "textual==8.2.8",
    "watchdog==6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "python-frontmatter==1.3.0",
]
enhanced = [
    "filelock==3.32.2",
    "Pygments",
]

[project.scripts]
kagent = "src.cli.main:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
