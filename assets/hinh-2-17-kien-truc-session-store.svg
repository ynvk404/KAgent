<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 530" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d3748"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- 1. Agent Core -->
  <g transform="translate(240, 22)">
    <rect width="260" height="60" rx="8" fill="#ffffff" stroke="#2d3748" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="130" y="23" font-family="Arial, sans-serif" font-size="11" fill="#718096" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="130" y="44" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a202c" text-anchor="middle">Agent Core</text>
  </g>

  <!-- Connectors: Agent Core <-> Session Store -->
  <!-- Save Arrow -->
  <line x1="320" y1="82" x2="320" y2="142" stroke="#2d3748" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="205" y="102" width="108" height="20" rx="4" fill="#edf2f7"/>
  <text x="259" y="116" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2d3748" text-anchor="middle">Lưu trạng thái (save)</text>

  <!-- Load Arrow -->
  <line x1="420" y1="142" x2="420" y2="88" stroke="#2d3748" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="428" y="102" width="118" height="20" rx="4" fill="#edf2f7"/>
  <text x="487" y="116" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2d3748" text-anchor="middle">Khôi phục phiên (load)</text>

  <!-- 2. Session Store -->
  <g transform="translate(195, 145)">
    <rect width="350" height="126" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="175" y="23" font-family="Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="175" y="44" font-family="Arial, sans-serif" font-size="15.5" font-weight="bold" fill="#2b6cb0" text-anchor="middle">Session Store</text>
    <line x1="20" y1="54" x2="330" y2="54" stroke="#cbd5e0" stroke-width="1"/>
    
    <text x="35" y="74" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">• Lưu trạng thái phiên</text>
    <text x="35" y="93" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">• Nạp và khôi phục trạng thái</text>
    <text x="35" y="112" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">• Quản lý dữ liệu phiên</text>
    <text x="35" y="131" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">• Hỗ trợ duy trì tính liên tục</text>
  </g>

  <!-- Connector: Session Store -> SessionFile -->
  <line x1="370" y1="271" x2="370" y2="310" stroke="#2d3748" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="295" y="281" width="150" height="19" rx="4" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="370" y="295" font-family="Arial, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle">Đóng gói / Phân rã dữ liệu</text>

  <!-- 3. SessionFile Structure Container -->
  <g transform="translate(45, 315)">
    <rect width="650" height="106" rx="8" fill="#f8fafc" stroke="#4a5568" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="18" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2d3748">Cấu trúc dữ liệu trạng thái phiên (SessionFile)</text>
    
    <!-- Sub-boxes -->
    <g transform="translate(15, 30)">
      <rect width="145" height="64" rx="6" fill="#ffffff" stroke="#718096" stroke-width="1.2"/>
      <text x="72" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a202c" text-anchor="middle">Mục tiêu &amp; Phạm vi</text>
      <text x="72" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#718096" text-anchor="middle">Target,</text>
      <text x="72" y="55" font-family="Arial, sans-serif" font-size="10.5" fill="#718096" text-anchor="middle">EngagementState</text>
    </g>
    
    <g transform="translate(172, 30)">
      <rect width="145" height="64" rx="6" fill="#ffffff" stroke="#718096" stroke-width="1.2"/>
      <text x="72" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a202c" text-anchor="middle">Workflow State</text>
      <text x="72" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#718096" text-anchor="middle">Trạng thái có cấu trúc</text>
      <text x="72" y="55" font-family="Arial, sans-serif" font-size="10.5" fill="#718096" text-anchor="middle">quy trình kiểm thử</text>
    </g>

    <g transform="translate(329, 30)">
      <rect width="145" height="64" rx="6" fill="#ffffff" stroke="#718096" stroke-width="1.2"/>
      <text x="72" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a202c" text-anchor="middle">Session Memory</text>
      <text x="72" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#718096" text-anchor="middle">Bản tóm lược</text>
      <text x="72" y="55" font-family="Arial, sans-serif" font-size="10.5" fill="#718096" text-anchor="middle">ngữ cảnh tiếp diễn</text>
    </g>

    <g transform="translate(486, 30)">
      <rect width="150" height="64" rx="6" fill="#ffffff" stroke="#718096" stroke-width="1.2"/>
      <text x="75" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a202c" text-anchor="middle">Messages</text>
      <text x="75" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#718096" text-anchor="middle">Lịch sử chuỗi</text>
      <text x="75" y="55" font-family="Arial, sans-serif" font-size="10.5" fill="#718096" text-anchor="middle">tương tác tuần tự</text>
    </g>
  </g>

  <!-- Connector: SessionFile -> Storage File -->
  <line x1="370" y1="421" x2="370" y2="455" stroke="#2d3748" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 4. Persistent Storage File -->
  <g transform="translate(230, 458)">
    <rect width="280" height="48" rx="6" fill="#f7fafc" stroke="#2d3748" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Folded paper icon -->
    <path d="M 22 14 L 32 14 L 37 19 L 37 34 L 22 34 Z" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
    <path d="M 32 14 L 32 19 L 37 19" fill="none" stroke="#4a5568" stroke-width="1.2"/>
    <text x="150" y="29" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a202c" text-anchor="middle">Tệp trạng thái phiên (.json)</text>
  </g>
</svg>